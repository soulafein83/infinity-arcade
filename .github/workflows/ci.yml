name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (editable)
        run: pip install -e .

      # Integration tests require a live Lemonade Server (managed by the
      # user, never started by this fork) - unit tests only in CI.
      - name: Run unit tests
        run: pytest test/ --ignore=test/lemonade_client_integration.py -v
